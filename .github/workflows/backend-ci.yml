name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Définir JAVA_HOME
        run: echo "JAVA_HOME=${{ env.JAVA_HOME }}" >> $GITHUB_ENV

      - name: Construire le projet avec Maven
        run: mvn clean install

      - name: Lancer les tests unitaires
        run: mvn test

      - name: Lancer les tests d'intégration
        run: mvn verify -Pintegration-tests

      - name: Scanner le code avec SonarCloud
        uses: sonarsource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: "."

      - name: Afficher un message si tout est OK
        run: echo "Backend build & tests réussis"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Sauvegarder le JAR généré
        uses: actions/upload-artifact@v3
        with:
          name: akkor-hotel-backend
          path: target/*.jar

      - name: Fake Deploy
        run: echo "🚀 Déploiement simulé réussi !"
