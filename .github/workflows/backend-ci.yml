name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Construire le projet avec Maven
        run: mvn clean install

      - name: Lancer les tests
        run: mvn test

      - name: Afficher un message si tout est OK
        run: echo "✅ Backend build & tests réussis"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Fake Deploy
        run: echo "🚀 Déploiement simulé réussi !"
